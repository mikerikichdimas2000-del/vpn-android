name: release

# Собирает подписанный APK и публикует релиз вместе с latest.json,
# который приложение читает для проверки обновлений.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Нет секрета KEYSTORE_BASE64 — релиз будет неподписанным" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "VPN_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          VPN_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VPN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VPN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Verify signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Package assets
        id: package
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts | head -1)
          APK="vpn-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK")
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            v*) ;;
            *) TAG="v$VERSION" ;;
          esac
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK}"
          NOTES_FILE="docs/release-notes/${VERSION}.md"
          if [ -f "$NOTES_FILE" ]; then
            NOTES=$(cat "$NOTES_FILE")
          else
            NOTES="Версия ${VERSION}"
          fi
          python3 - "$CODE" "$VERSION" "$URL" "$SHA" "$SIZE" "$NOTES" > latest.json <<'PY'
          import json, sys
          code, version, url, sha, size, notes = sys.argv[1:7]
          print(json.dumps({
              "versionCode": int(code),
              "versionName": version,
              "url": url,
              "sha256": sha,
              "size": int(size),
              "notes": notes,
          }, ensure_ascii=False, indent=2))
          PY
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "apk=$APK"
          } >> "$GITHUB_OUTPUT"
          cat latest.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_FILE="docs/release-notes/${{ steps.package.outputs.version }}.md"
          if [ -f "$NOTES_FILE" ]; then
            NOTES_ARGS=(--notes-file "$NOTES_FILE")
          else
            NOTES_ARGS=(--notes "Версия ${{ steps.package.outputs.version }}")
          fi
          gh release create "${{ steps.package.outputs.tag }}" \
            "${{ steps.package.outputs.apk }}" latest.json \
            --title "VPN ${{ steps.package.outputs.version }}" \
            --latest \
            "${NOTES_ARGS[@]}"
